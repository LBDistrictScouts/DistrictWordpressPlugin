name: Build WordPress Plugin Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build plugin zip
        run: |
          PLUGIN_DIR="district-wordpress-plugin"
          ZIP_FILE="$PLUGIN_DIR.zip"
          
          # Create a temporary build directory
          mkdir -p build/$PLUGIN_DIR
          
          # Copy plugin files, excluding unnecessary files
          rsync -av \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.github' \
            --exclude='.devcontainer' \
            --exclude='node_modules' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            --exclude='build' \
            ./ build/$PLUGIN_DIR/
          
          # Create zip file
          cd build
          zip -r "$ZIP_FILE" "$PLUGIN_DIR" -q
          cd ..
          
          # Move zip to root for easy access
          mv "build/$ZIP_FILE" .
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Built $ZIP_FILE successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: district-wordpress-plugin
          path: district-wordpress-plugin.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: district-wordpress-plugin.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
