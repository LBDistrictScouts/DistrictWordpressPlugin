name: Test, Build & Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ["8.1", "8.2", "8.3"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          extensions: mbstring, xml
          coverage: pcov

      - name: Verify PHP setup
        run: |
          php -v
          php -m | grep -E 'mbstring|xml|pcov' || echo "Note: pcov might not be shown in cli mode"
          composer --version

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-php${{ matrix.php-version }}-

      - name: Install dependencies
        run: |
          composer validate
          composer install --no-interaction --prefer-dist --no-progress

      - name: Verify Composer autoloading
        run: |
          php -r "require 'vendor/autoload.php'; exit(class_exists('LBDistrictScouts\\DistrictWordpressPlugin\\Plugin') ? 0 : 1);"
          php -r "require 'vendor/autoload.php'; exit(class_exists('LBDistrictScouts\\DistrictWordpressPlugin\\TeamRole') ? 0 : 1);"

      - name: Run PHPUnit tests
        run: composer run test

      - name: Check PHP syntax
        if: matrix.php-version == '8.1'
        run: composer run lint

      - name: Run PHPStan static analysis
        if: matrix.php-version == '8.1'
        continue-on-error: true
        run: composer run phpstan

      - name: Check WordPress Coding Standards
        if: matrix.php-version == '8.1'
        continue-on-error: true
        run: composer run phpcs

      - name: Generate coverage report
        if: matrix.php-version == '8.1'
        run: |
          mkdir -p coverage
          composer run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.php-version == '8.1' && always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage report
        if: matrix.php-version == '8.1' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  wordpress-integration:
    name: WordPress integration
    needs: test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer, wp-cli
          extensions: mbstring, mysqli, xml
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Build plugin package
        run: |
          PLUGIN_DIR="district-wordpress-plugin"
          mkdir -p "build/$PLUGIN_DIR"
          rsync -av \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.github' \
            --exclude='.devcontainer' \
            --exclude='node_modules' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            --exclude='build' \
            --exclude='tests' \
            ./ "build/$PLUGIN_DIR/"
          cd build
          zip -r "$PLUGIN_DIR.zip" "$PLUGIN_DIR" -q

      - name: Install WordPress
        run: |
          mkdir -p /tmp/wordpress
          wp core download --path=/tmp/wordpress --force
          wp config create \
            --path=/tmp/wordpress \
            --dbname=wordpress \
            --dbuser=wordpress \
            --dbpass=wordpress \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp core install \
            --path=/tmp/wordpress \
            --url=http://localhost \
            --title="District Plugin CI" \
            --admin_user=admin \
            --admin_password=ci-password \
            --admin_email=ci@example.invalid \
            --skip-email

      - name: Install and activate built plugin
        run: |
          wp plugin install "$GITHUB_WORKSPACE/build/district-wordpress-plugin.zip" \
            --path=/tmp/wordpress \
            --activate
          wp plugin status district-wordpress-plugin --path=/tmp/wordpress

      - name: Verify TeamRole is registered in WordPress
        run: |
          wp eval 'if (!post_type_exists("team_role")) { fwrite(STDERR, "team_role post type was not registered\n"); exit(1); }' \
            --path=/tmp/wordpress

  build:
    needs: [test, wordpress-integration]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer
          extensions: mbstring, xml

      - name: Verify PHP setup
        run: |
          php -v
          php -m | grep -E 'mbstring|xml'
          composer --version

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php8.1-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-php8.1-

      - name: Install dependencies
        run: |
          composer validate
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Build plugin zip
        run: |
          PLUGIN_DIR="district-wordpress-plugin"
          ZIP_FILE="$PLUGIN_DIR.zip"
          mkdir -p build/$PLUGIN_DIR
          rsync -av \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.github' \
            --exclude='.devcontainer' \
            --exclude='node_modules' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            --exclude='build' \
            --exclude='tests' \
            ./ build/$PLUGIN_DIR/
          cd build
          zip -r "$ZIP_FILE" "$PLUGIN_DIR" -q
          cd ..
          mv "build/$ZIP_FILE" .
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Built $ZIP_FILE successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: district-wordpress-plugin
          path: district-wordpress-plugin.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: district-wordpress-plugin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: district-wordpress-plugin.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
