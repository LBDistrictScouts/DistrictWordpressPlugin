name: Test, Build & Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ["8.1", "8.2", "8.3"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          extensions: mbstring, xml
          coverage: pcov

      - name: Verify PHP setup
        run: |
          php -v
          php -m | grep -E 'mbstring|xml|pcov' || echo "Note: pcov might not be shown in cli mode"
          composer --version

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-php${{ matrix.php-version }}-

      - name: Install dependencies
        run: |
          composer validate
          composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit tests
        run: composer run test

      - name: Check PHP syntax
        if: matrix.php-version == '8.1'
        run: composer run lint

      - name: Run PHPStan static analysis
        if: matrix.php-version == '8.1'
        continue-on-error: true
        run: composer run phpstan

      - name: Check WordPress Coding Standards
        if: matrix.php-version == '8.1'
        continue-on-error: true
        run: composer run phpcs

      - name: Generate coverage report
        if: matrix.php-version == '8.1'
        run: |
          mkdir -p coverage
          php vendor/bin/phpunit --coverage-html=coverage --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.php-version == '8.1' && always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage report
        if: matrix.php-version == '8.1' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer
          extensions: mbstring, xml

      - name: Verify PHP setup
        run: |
          php -v
          php -m | grep -E 'mbstring|xml'
          composer --version

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php8.1-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-php8.1-

      - name: Install dependencies
        run: |
          composer validate
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Build plugin zip
        run: |
          PLUGIN_DIR="district-wordpress-plugin"
          ZIP_FILE="$PLUGIN_DIR.zip"

          # Create a temporary build directory
          mkdir -p build/$PLUGIN_DIR

          # Copy plugin files, excluding unnecessary files
          rsync -av \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.github' \
            --exclude='.devcontainer' \
            --exclude='node_modules' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            --exclude='build' \
            --exclude='tests' \
            ./ build/$PLUGIN_DIR/

          # Create zip file
          cd build
          zip -r "$ZIP_FILE" "$PLUGIN_DIR" -q
          cd ..

          # Move zip to root for easy access
          mv "build/$ZIP_FILE" .
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Built $ZIP_FILE successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: district-wordpress-plugin
          path: district-wordpress-plugin.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: district-wordpress-plugin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: district-wordpress-plugin.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
